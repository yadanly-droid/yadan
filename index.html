:root{--bg:#F2F6F7;--sf:#fff;--tx:#0B2B3A;--mu:#5B7280;--pr:#0A47FF;--ac:#FF5A00;--ln:#D5E1E5;--bad:#B3261E;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A1B23;--sf:#12303C;--tx:#EAF3F5;--mu:#93AEB8;--pr:#7C9CFF;--ln:#24475A;--on:#06222B;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Cairo,system-ui,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:8px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pr);line-height:1.1}.logo img,.logo svg{width:40px;height:40px;border-radius:10px;object-fit:cover}.logo small{display:block;font-weight:400;color:var(--mu);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{padding:6px 10px;border-radius:8px;color:var(--tx);text-decoration:none;white-space:nowrap;cursor:pointer;font-size:14px}nav a:hover{background:var(--bg)}
.b{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:9px 16px;font:600 14px Cairo,sans-serif;cursor:pointer}.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}.b.a{background:var(--ac);color:#2A1B00}.b.d{background:var(--bad);color:#fff}.b.s{padding:5px 10px;font-size:13px}
.hero{position:relative;color:#fff;background:linear-gradient(#0A2A8F,#0A47FF 80%,#3D6BFF);overflow:hidden;padding:56px 18px 150px;text-align:start}
.hero .bgi{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;transition:opacity 1.5s}.hero>div{position:relative;max-width:640px;margin:auto}
.hero h1{margin-top:0;font-size:clamp(30px,7vw,52px);line-height:1.2;margin:0 0 12px;font-weight:800}.hero p{font-size:18px;opacity:.9;margin:0 0 22px}
.sky{position:absolute;bottom:0;left:0;width:100%;height:130px}
section{max-width:900px;margin:auto;padding:30px 16px}h2{margin:0 0 14px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.grid .card{margin:0}
.ic{font-size:30px}.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.steps{display:grid;gap:10px;counter-reset:s}.steps div{counter-increment:s;padding-inline-start:46px;position:relative}.steps div:before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#2A1B00;display:grid;place-items:center;font-weight:800}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}label{display:block;font-size:14px;color:var(--mu)}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 10px;font-size:13px;margin:2px}.ok{color:#1B7F3B}.bad{color:var(--bad)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}.tabs a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mu);cursor:pointer}.tabs a.on{color:var(--pr);font-weight:800}.tabs span{display:block;font-size:20px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);width:min(92vw,440px);max-height:85vh}dialog::backdrop{background:#0008}
.msg{padding:6px 10px;border-radius:12px;margin:4px 0;max-width:80%;background:var(--bg)}.msg.me{background:var(--pr);color:var(--on);margin-inline-start:auto}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:20;display:none}
pre{white-space:pre-wrap;font:inherit}.wrap{max-width:720px;margin:auto;padding:16px}
</style></head><body><div id="app"></div><div id="toast"></div>

function head(){return `<header><div class="logo" data-a="go" data-p="home">${logoH()}<div>${esc(D.cfg.ar)}<small>${esc(D.cfg.en)}</small></div></div><nav><a data-a="go" data-p="home">${T('الرئيسية','Home')}</a><a data-a="sc" data-id="svc">${T('الخدمات','Services')}</a><a data-a="sc" data-id="how">${T('كيف تعمل','How it works')}</a><a data-a="go" data-p="rules">${T('القوانين','Rules')}</a></nav><button class="b g s" data-a="lang">${lang=='ar'?'EN':'عربي'}</button>${me?`<button class="b s" data-a="go" data-p="app">${T('حسابي','My app')}</button>`:`<button class="b s" data-a="go" data-p="auth">${T('دخول','Login')}</button>`}</header>`}
function home(){return `<div class="hero">${(D.cfg.bg?[D.cfg.bg]:PICS).map((p,i)=>`<div class="bgi" style="background-image:url(${p});opacity:${i?0:.4}"></div>`).join('')}<div><div style="background:#fff;border-radius:18px;display:inline-block;padding:14px 20px;margin-bottom:18px"><img src="${FULL}" alt="yadan - give a hand" style="height:120px;display:block"></div><h1>${T('يدٌ بيد.. خدمات بنغازي في مكان واحد','Hand in hand: Benghazi’s services in one place')}</h1><p>${T('منصة اجتماعية تربط من يحتاج خدمة بمن يقدّمها، قريباً منك وبثقة.','A social platform that connects people who need a service with nearby, verified providers.')}</p><div class="row"><button class="b a" data-a="go" data-p="auth" data-m="register">${T('أنشئ حسابك','Create account')}</button><button class="b g" style="color:#fff;border-color:#fff" data-a="go" data-p="auth">${T('تسجيل الدخول','Log in')}</button></div></div>${sky}</div>
<section id="svc"><h2>${T('خدماتنا','Our services')}</h2><div class="grid">${D.services.map(s=>`<div class="card"><div class="ic">${s.i}</div><b>${esc(sn(s))}</b></div>`).join('')}</div></section>
<section id="city"><h2>${T('مدينة بنغازي','Benghazi')}</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${PICS.map(p=>`<img src="${p}" alt="${T('بنغازي','Benghazi')}" loading="lazy" style="width:100%;height:150px;object-fit:cover;border-radius:14px">`).join('')}</div></section><section id="how"><h2>${T('كيف تعمل المنصة','How it works')}</h2><div class="steps"><div><b>${T('سجّل بحساب واحد','One account')}</b><br><span class="mu">${T('الحساب نفسه يطلب الخدمة ويقدّمها. رقم الهاتف وصورة الهوية إلزاميان.','The same account can request and offer services. Phone and ID photo are required.')}</span></div><div><b>${T('اطلب أو اعرض خدمة','Request or offer')}</b><br><span class="mu">${T('يظهر لك الأقرب إليك مع التقييمات.','See the nearest providers with ratings.')}</span></div><div><b>${T('نسّق وقيّم','Chat and rate')}</b><br><span class="mu">${T('دردشة محدودة للتنسيق وتتبع الموقع ثم تقييم بعد الإنجاز.','Limited chat, GPS location, then a rating after the job.')}</span></div></div></section>
<section><div class="card"><b>${T('الأمان','Safety')}</b><p class="mu">${T('توثيق الهوية، بلاغات، حظر، ودعم فني قريب منك.','ID verification, reports, blocking and nearby support.')}</p><button class="b g s" data-a="go" data-p="rules">${T('اقرأ القوانين','Read the rules')}</button></div></section>`}
function rules(){return `<div class="wrap"><h2>${T('القوانين واللوائح','Rules & policies')}</h2><div class="card"><pre>${esc(D.rules[lang])}</pre></div></div>`}
function auth(){const r=mode=='register';return `<div class="wrap"><div class="card"><h2>${r?T('حساب جديد','Create account'):T('تسجيل الدخول','Log in')}</h2>${r?`<label>${T('الاسم','Name')}<input id="n"></label>`:''}<label>${r?T('رقم الهاتف (إلزامي)','Phone (required)'):T('رقم الهاتف أو البريد','Phone or email')}<input id="ph" type="${r?'tel':'text'}"></label>${r?`<label>${T('البريد الإلكتروني (لاسترجاع كلمة المرور)','Email (for password recovery)')}<input id="em" type="email"></label>`:''}<label>${T('كلمة المرور','Password')}<input id="pw" type="password"></label>${r?`<label>${T('صورة شخصية أو إثبات هوية','Selfie or ID photo')}<input type="file" accept="image/*" data-a="idimg" id="idf"></label><div id="prev"></div><label><input type="checkbox" id="ag" style="width:auto"> ${T('أوافق على القوانين','I accept the rules')}</label>`:''}<div class="row"><button class="b" data-a="${r?'reg':'login'}">${r?T('إنشاء','Create'):T('دخول','Log in')}</button><button class="b g" data-a="mode">${r?T('لدي حساب','I have an account'):T('حساب جديد','New account')}</button>${r?'':`<button class="b g" data-a="forgot">${T('نسيت كلمة المرور','Forgot password')}</button>`}</div></div></div>`}
function card(u){const d=dist(M(),u),a=avg(u.id),lk=(D.likes[u.id]||[]),cm=D.comments.filter(c=>c.to==u.id);return `<div class="card"><div class="row sp"><b>${esc(u.name)} ${u.ok?'<span class="ok">✔</span>':''}</b><span>${a?'⭐ '+a:T('بلا تقييم','No rating')}</span></div><div>${u.offers.map(k=>`<span class="chip">${S(k)?.i||''} ${esc(sn(S(k)))}</span>`).join('')}</div><div class="mu">${dtx(d)} ${map(u)}</div><div class="row"><button class="b g s" data-a="like" data-id="${u.id}">${lk.includes(me)?'❤️':'🤍'} ${lk.length}</button><button class="b g s" data-a="rep" data-id="${u.id}">🚩 ${T('إبلاغ','Report')}</button><button class="b g s" data-a="blk" data-id="${u.id}">⛔ ${T('حظر','Block')}</button></div>${cm.slice(-2).map(c=>`<div class="mu">💬 <b>${esc(U(c.from)?.name)}</b>: ${esc(c.t)}</div>`).join('')}<div class="row"><input id="c${u.id}" maxlength="140" placeholder="${T('اكتب تعليقاً','Comment')}" style="flex:1;margin:4px 0"><button class="b s" data-a="cmt" data-id="${u.id}">${T('نشر','Post')}</button></div></div>`}
